[Unit]
# The dom0 UUID comes from XCP-ng's inventory (made by host-setup), not
# from XEN_DOM0_UUID in /etc/sysconfig/xencommons
Requires=xcpng-riscv-host.service
After=xcpng-riscv-host.service
Before=xenopsd-xc.service xapi.service

[Service]
EnvironmentFile=/etc/xensource-inventory
ExecStart=
ExecStart=/usr/libexec/xen/bin/xen-init-dom0 ${CONTROL_DOMAIN_UUID}
