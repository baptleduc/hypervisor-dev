[Unit]
# The default cert asks xcp-networkd for the management address
After=xcp-networkd.service xcpng-riscv-host.service

[Service]
# Without a dom0 NIC xcp-networkd reports no management address and
# gencert default never returns: bound it, and serve the pool cert on
# 443 instead
ExecStart=
ExecStart=/opt/xensource/libexec/gencert /etc/xensource/xapi-pool-tls.pem -1 xapi:pool
ExecStart=/bin/sh -c 'timeout 120 /opt/xensource/libexec/gencert /etc/xensource/xapi-ssl.pem 204 default || cp /etc/xensource/xapi-pool-tls.pem /etc/xensource/xapi-ssl.pem'
