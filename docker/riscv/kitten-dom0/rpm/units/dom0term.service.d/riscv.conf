[Service]
# The packaged dom0term.sh runs login straight on vncterm's pty, where
# the console's Enter arrives as CR and util-linux login times out;
# ours runs agetty, which maps CR
ExecStart=
ExecStart=/opt/xensource/libexec/vncterm-wrapper 0 -v 127.0.0.1:0 -r -x /local/domain/0/console -T -c /usr/libexec/xcpng-riscv/dom0term.sh
