# /etc/xapi.conf.d/riscv.conf: the RISC-V dom0's differences from stock
# rawfile is the one SM driver here (no python sm, no tapdisk)
sm-plugins=rawfile
# Start-up syncs for subsystems this dom0 lacks (crashdump, cache SR,
# host drivers...); sync_sm_records stays on, or the rawfile record is
# never created
disable-dbsync-for=sync_set_cache_sr sync_load_rrd sync_crashdump_resynchronise sync_pbds sync_pif_params sync_local_vdi_activations sync_host_driver
# x86 or not-yet-packaged helpers xapi checks for at start-up (busybox,
# xen-cmdline, dracut and sparse_dd now come with the RPM set)
pbis-force-domain-leave-script=/usr/libexec/xenopsd-stub
redo-log-block-device-io=/usr/libexec/xenopsd-stub
fence=/usr/libexec/xenopsd-stub
host-bugreport-upload=/usr/libexec/xenopsd-stub
set-hostname=/usr/libexec/xenopsd-stub
xe-syslog-reconfigure=/usr/libexec/xenopsd-stub
logs-download=/usr/libexec/xenopsd-stub
update-mh-info=/usr/libexec/xenopsd-stub
upload-wrapper=/usr/libexec/xenopsd-stub
host-backup=/usr/libexec/xenopsd-stub
host-restore=/usr/libexec/xenopsd-stub
xsh=/usr/libexec/xenopsd-stub
static-vdis=/usr/libexec/xenopsd-stub
xen-cmdline-script=/usr/libexec/xenopsd-stub
list_domains=/usr/libexec/xenopsd-stub
alert-certificate-check=/usr/libexec/xenopsd-stub
set-iscsi-initiator=/usr/libexec/xenopsd-stub
createrepo-cmd=/usr/libexec/xenopsd-stub
modifyrepo-cmd=/usr/libexec/xenopsd-stub
firewall-port-config=/usr/libexec/xenopsd-stub
