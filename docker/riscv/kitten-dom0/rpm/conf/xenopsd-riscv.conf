# /etc/xenopsd.conf.d/riscv.conf: the RISC-V dom0's differences from stock
# No udev hotplug rules for these backends here: xenopsd runs the
# scripts itself, and they are the busybox-compatible RISC-V ones
run_hotplug_scripts=true
vif-script=/usr/lib/xenopsd/vif-riscv
vbd-script=/usr/lib/xenopsd/block-riscv
# blkback, not tapdisk3 (vbd3): there is no tapdisk here
default-vbd-backend-kind=vbd
# guest consoles at 180x54, like the dom0 one (see vncterm-guest)
vncterm=/usr/libexec/xcpng-riscv/vncterm-guest
emu-manager=/usr/libexec/xenopsd-stub
setup-vif-rules=/usr/libexec/xenopsd-stub
setup-pvs-proxy-rules=/usr/libexec/xenopsd-stub
