# xcp-networkd standalone in the RISC-V dom0 initrd: no message-switch, xapi
# reaches it over its unix socket. No NIC is configured (no management
# interface in the inventory), it only answers xapi.
use-switch=false
network-conf=/etc/xcp/network.conf
# ponytail: tools it checks for at start-up but never runs without PIFs;
# point them at real ones when bringing up networking.
brctl=/usr/libexec/xenopsd-stub
ethtool=/usr/libexec/xenopsd-stub
