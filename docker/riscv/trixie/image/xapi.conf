# xapi standalone in the RISC-V dom0 initrd: no message-switch, xapi
# talks to xenopsd-xc over /var/lib/xcp/xenopsd directly.
use-switch=false
# logs go to syslog, rcS starts syslogd -O /var/log/messages
search-path=/bin:/sbin:/usr/bin:/usr/sbin
xe=/usr/bin/xe
# No storage (SM, xcp-rrdd) and no networking (xcp-networkd) in this dom0:
# skip the start-up syncs that talk to them.
disable-dbsync-for=sync_set_cache_sr sync_load_rrd sync_crashdump_resynchronise sync_pbds sync_pif_params sync_sm_records sync_local_vdi_activations
# ponytail: tools xapi checks for at start-up but a single host with no
# storage, pool, HA or updates never runs; point them at real ones when
# bringing up the matching feature.
pbis-force-domain-leave-script=/usr/libexec/xenopsd-stub
redo-log-block-device-io=/usr/libexec/xenopsd-stub
sparse_dd=/usr/libexec/xenopsd-stub
vhd-tool=/usr/libexec/xenopsd-stub
qcow_to_stdout=/usr/libexec/xenopsd-stub
qcow_stream_tool=/usr/libexec/xenopsd-stub
fence=/usr/libexec/xenopsd-stub
host-bugreport-upload=/usr/libexec/xenopsd-stub
set-hostname=/usr/libexec/xenopsd-stub
xe-syslog-reconfigure=/usr/libexec/xenopsd-stub
logs-download=/usr/libexec/xenopsd-stub
update-mh-info=/usr/libexec/xenopsd-stub
upload-wrapper=/usr/libexec/xenopsd-stub
host-backup=/usr/libexec/xenopsd-stub
host-restore=/usr/libexec/xenopsd-stub
xe-toolstack-restart=/usr/libexec/xenopsd-stub
xsh=/usr/libexec/xenopsd-stub
static-vdis=/usr/libexec/xenopsd-stub
xen-cmdline-script=/usr/libexec/xenopsd-stub
list_domains=/usr/libexec/xenopsd-stub
systemctl=/usr/libexec/xenopsd-stub
alert-certificate-check=/usr/libexec/xenopsd-stub
gencert=/usr/libexec/xenopsd-stub
openssl_path=/usr/libexec/xenopsd-stub
set-iscsi-initiator=/usr/libexec/xenopsd-stub
createrepo-cmd=/usr/libexec/xenopsd-stub
modifyrepo-cmd=/usr/libexec/xenopsd-stub
rpm-cmd=/usr/libexec/xenopsd-stub
depmod=/usr/libexec/xenopsd-stub
dracut=/usr/libexec/xenopsd-stub
udevadm=/usr/libexec/xenopsd-stub
