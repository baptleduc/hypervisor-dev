# xenopsd-xc standalone in the RISC-V dom0 initrd: no xapi, no
# message-switch, xenopsd-cli talks to /var/lib/xcp/xenopsd directly.
use-switch=false
# logs go to syslog (local5), rcS starts syslogd -O /var/log/messages
search-path=/bin:/sbin:/usr/bin:/usr/sbin
xenguest=/usr/lib/xen/bin/xenguest
network-conf=/etc/xcp/network.conf
# busybox: no /usr/sbin/{modprobe,rmmod}, the xenopsd defaults
modprobe=/sbin/modprobe
rmmod=/sbin/rmmod
# ponytail: tools xenopsd checks for at start-up but a direct-boot guest
# without disks or VIFs never runs; point them at real ones when adding
# devices (block/vif scripts) or migration (emu-manager).
vbd-script=/usr/libexec/xenopsd-stub
vif-script=/usr/libexec/xenopsd-stub
emu-manager=/usr/libexec/xenopsd-stub
tune2fs=/usr/libexec/xenopsd-stub
setup-vif-rules=/usr/libexec/xenopsd-stub
setup-pvs-proxy-rules=/usr/libexec/xenopsd-stub
zstd=/usr/libexec/xenopsd-stub
